<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BANTU Group – Téléchargement</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0D0D10;
      color: #F0F0F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 24px;
    }

    .header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .header img { height: 40px; }
    .header span {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem; font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
    }

    .card {
      width: 100%; max-width: 420px;
      border-radius: 20px;
      padding: 32px 28px;
      display: flex; flex-direction: column; align-items: center;
      gap: 20px;
      text-align: center;
    }
    .card-red {
      background: #1A0A0A;
      border: 1px solid rgba(216,43,43,0.35);
    }
    .card-sky {
      background: #071522;
      border: 1px solid rgba(91,184,245,0.3);
    }

    .card-logo { height: 80px; object-fit: contain; }

    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem; font-weight: 800;
    }
    .card-sub {
      font-size: 0.82rem;
      color: #888;
      margin-top: -12px;
    }

    .dl-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 28px; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      width: 100%; justify-content: center;
    }
    .dl-btn:hover { transform: translateY(-2px); }
    .dl-btn-red {
      background: #D82B2B; color: #fff;
      box-shadow: 0 4px 20px rgba(216,43,43,0.4);
    }
    .dl-btn-red:hover { box-shadow: 0 8px 28px rgba(216,43,43,0.55); }
    .dl-btn-sky {
      background: #5BB8F5; color: #04111E;
      box-shadow: 0 4px 20px rgba(91,184,245,0.35);
    }
    .dl-btn-sky:hover { box-shadow: 0 8px 28px rgba(91,184,245,0.5); }

    .size-hint { font-size: 0.75rem; color: #555; }

    footer {
      margin-top: 16px;
      font-size: 0.75rem; color: #444;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="ban.jpg" alt="BANTU Group" onerror="this.style.display='none'"/>
    <span>BANTU Group</span>
  </div>

  <!-- App 1 : Livraison -->
  <div class="card card-red">
    <img src="ban.jpg" alt="BANTU Livraison" class="card-logo"/>
    <div class="card-name">BANTU Livraison</div>
    <div class="card-sub">Application de livraison de colis</div>
    <a href="https://github.com/M-E7/bantouapp/releases/download/V1/livraison.apk" download="BANTU-Livraison.apk" class="dl-btn dl-btn-red">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Télécharger l'APK
    </a>
    <div class="size-hint">Android · 106 MB</div>
  </div>

  <!-- App 2 : PEU -->
  <div class="card card-sky">
    <img src="peu.jpg" alt="PEU" class="card-logo"/>
    <div class="card-name">Plateforme Éducative Ubuntu</div>
    <div class="card-sub">Apprendre ensemble, grandir Ubuntu</div>
    <a href="https://github.com/M-E7/bantouapp/releases/download/V1/educative.apk" download="PEU-Ubuntu.apk" class="dl-btn dl-btn-sky">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Télécharger l'APK
    </a>
    <div class="size-hint">Android</div>
  </div>

  <footer>© 2025 BANTU Group · par M-E7</footer>

</body>
</html>
